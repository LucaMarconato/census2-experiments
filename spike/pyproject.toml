[project]
name = "census2-experiments-spike"
version = "0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "census2-dataset-writer[s3]",
    "census2-sdk[s3,iceberg,duckdb]",
    "pyiceberg[pyarrow,sql-sqlite]",
    "icechunk",
    "py-spy",
    "tabulate",
]

[tool.uv]
package = false

[tool.uv.sources]
census2-dataset-writer = { path = "../ext/spike-obs/census2-dataset-writer", editable = true }
census2-sdk = { path = "../ext/spike-obs/census2-sdk", editable = true }
