[workspace]
name = "census2-experiments"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = "3.12.*"
aria2 = "*"  # stage-refdata.py
awscli = "*"  # uploads to the local S3 emulators
graphviz = "*"  # docs/dag.py

[pypi-dependencies]
tabulate = "*"

[feature.main.pypi-dependencies]
census2-dataset-writer = { path = "ext/cellxgene-census2-prototype/census2-dataset-writer", editable = true, extras = ["s3"] }
census2-sdk = { path = "ext/cellxgene-census2-prototype/census2-sdk", editable = true, extras = ["s3"] }
icechunk = ">=2.3.1"
py-spy = "*"

[feature.spike.pypi-dependencies]
census2-dataset-writer = { path = "ext/spike-obs/census2-dataset-writer", editable = true, extras = ["s3"] }
census2-sdk = { path = "ext/spike-obs/census2-sdk", editable = true, extras = ["s3", "iceberg", "duckdb"] }
pyiceberg = { version = "*", extras = ["pyarrow", "sql-sqlite"] }

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"  # config.py, from any folder

[environments]
default = { features = ["main"], solve-group = "main" }
spike = { features = ["spike"], solve-group = "spike" }

# Every task takes the profile: real (default) or tiny (the 3 smallest datasets, everything under
# tiny/; each task and backend runs once: shape open, 8 workers, 1 repeat, a smoke test).
#   pixi run all tiny      the whole graph on the tiny profile
#   pixi run all           the whole graph on the real data

[tasks.download]
description = "Source h5ads of the prototype's manifests (tiny: the 3 smallest). Resumable"
args = [{ arg = "profile", default = "real" }]
env = { C2E_PROFILE = "{{ profile }}" }
cmd = "python prep/download.py {% if profile == 'tiny' %}--smallest 3{% endif %}"

[tasks.refdata]
description = "The writer's pinned gene references (GENCODE), via aria2c"
args = [{ arg = "profile", default = "real" }]
env = { C2E_PROFILE = "{{ profile }}" }
cmd = "sh -c 'eval \"$(python config.py)\" && python ext/cellxgene-census2-prototype/bulk-ingest-nf/tools/stage-refdata.py \"$DATA/refdata/\"'"

[tasks.convert]
description = "h5ad -> Census 2 Zarr stores in <data>/zarr; the 4GB store set (floci, parent, Icechunk). Resumable"
args = [{ arg = "profile", default = "real" }]
env = { C2E_PROFILE = "{{ profile }}" }
depends-on = [{ task = "download", args = ["{{ profile }}"] }, { task = "refdata", args = ["{{ profile }}"] }]
cmd = "python prep/subset.py all --source h5ad && python prep/convert.py && python prep/subset.py 4GB --from all --max-gib 4 --fill"

[tasks.floci]
description = "Start floci (local S3) in Docker and upload the 4GB set"
args = [{ arg = "profile", default = "real" }]
env = { C2E_PROFILE = "{{ profile }}" }
depends-on = [{ task = "convert", args = ["{{ profile }}"] }]
cmd = "sh floci/start.sh"

[tasks.bench]
description = "The prototype's benchmark on local-all, local-4GB, floci-4GB; table of medians"
args = [{ arg = "profile", default = "real" }]
env = { C2E_PROFILE = "{{ profile }}" }
depends-on = [{ task = "floci", args = ["{{ profile }}"] }]
cmd = "python benchmarks/bench.py {% if profile == 'tiny' %}--shapes open --workers 8 --repeats 1{% endif %} && python analysis/table.py"

[tasks.consistency]
description = "Same results on local disk and floci"
args = [{ arg = "profile", default = "real" }]
env = { C2E_PROFILE = "{{ profile }}" }
depends-on = [{ task = "bench", args = ["{{ profile }}"] }]
cmd = "python benchmarks/consistency.py local-4GB floci-4GB"

[tasks.scaling]
description = "Time vs number of stores (symlinked copies past the real ones); table and plot"
args = [{ arg = "profile", default = "real" }]
env = { C2E_PROFILE = "{{ profile }}" }
depends-on = [{ task = "floci", args = ["{{ profile }}"] }]
cmd = "python benchmarks/scaling.py {% if profile == 'tiny' %}--sizes 1,12 --floci-sizes 1 --shapes open --repeats 1{% else %}--sizes 5,10,20,44,103,200,500,1000,2000 --floci-sizes 5,10{% endif %} && python analysis/scaling_plot.py"

[tasks.icechunk]
description = "Separate stores vs one parent Zarr store vs Icechunk (copied and virtual), local and floci"
args = [{ arg = "profile", default = "real" }]
env = { C2E_PROFILE = "{{ profile }}" }
depends-on = [{ task = "floci", args = ["{{ profile }}"] }]
cmd = """python benchmarks/parent_zarr.py && sh floci/upload-parent.sh \
  && python benchmarks/icechunk_bench.py build --where local && python benchmarks/icechunk_bench.py build --where floci \
  && python -W ignore benchmarks/icechunk_bench.py bench --where local {% if profile == 'tiny' %}--shapes open --repeats 1{% endif %} \
  && python -W ignore benchmarks/icechunk_bench.py bench --where floci {% if profile == 'tiny' %}--shapes open --repeats 1{% endif %}"""

[tasks.latency]
description = "The Icechunk comparison on floci with +10 and +50 ms per request; table of all three files"
args = [{ arg = "profile", default = "real" }]
env = { C2E_PROFILE = "{{ profile }}" }
depends-on = [{ task = "icechunk", args = ["{{ profile }}"] }]
cmd = """python -W ignore benchmarks/icechunk_bench.py bench --where floci \
  {% if profile == 'tiny' %}--delays-ms 10 --shapes open --repeats 1{% else %}--delays-ms 10,50{% endif %} && python analysis/icechunk_table.py"""

[tasks.profiles]
description = "py-spy flamegraphs of the X, obs and cell-type reads (asks for sudo: py-spy needs root on macOS)"
args = [{ arg = "profile", default = "real" }]
env = { C2E_PROFILE = "{{ profile }}" }
depends-on = [{ task = "floci", args = ["{{ profile }}"] }]
cmd = "python benchmarks/bench.py --sets local-all,floci-4GB --catalogs-only && sh -c 'sudo C2E_PROFILE=$C2E_PROFILE PY=\"$(command -v python)\" sh benchmarks/profile.sh' && sh analysis/render_profiles.sh"

[tasks.all]
description = "Every benchmark (all but profiles, which needs sudo)"
args = [{ arg = "profile", default = "real" }]
depends-on = [
  { task = "consistency", args = ["{{ profile }}"] },
  { task = "scaling", args = ["{{ profile }}"] },
  { task = "latency", args = ["{{ profile }}"] },
  { task = "spike", args = ["{{ profile }}"], environment = "spike" },
]

[tasks.dag]
description = "Draw this task graph: docs/tasks.svg"
cmd = "dot -c && python docs/dag.py"  # dot -c: register the plugins (pixi skips conda post-link)

[tasks.floci-stop]
description = "Stop the floci containers"
cmd = "sh -c 'c=$(docker ps -q -f name=census2-); [ -z \"$c\" ] || docker stop $c'"

[feature.spike.tasks.spike]
description = "Spike: obs fragments, then stores vs Iceberg vs DuckDB over all stores"
args = [{ arg = "profile", default = "real" }]
env = { C2E_PROFILE = "{{ profile }}", SHAPES = "{% if profile == 'tiny' %}single{% endif %}", REPEATS = "{% if profile == 'tiny' %}1{% else %}3{% endif %}" }
depends-on = [{ task = "convert", args = ["{{ profile }}"], environment = "default" }]
cmd = "python spike/fragments.py && sh spike/bench.sh && python analysis/spike_table.py"
